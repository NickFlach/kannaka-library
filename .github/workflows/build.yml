name: Build library

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # nightly: pick up docs merged elsewhere and new releases
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test
      - name: Build manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: node scripts/build-manifest.mjs
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-library.mjs
      - name: Manifest must be signed on main
        run: test -s dist/constellation.json.sig
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # A tarball the portal can PULL. ninja-portal.com serves the library and
      # the manifest from its own disk, and the installer's default manifest
      # URL points there — so the portal must not depend on this workflow
      # holding a key to its box. It publishes; buzz fetches on a timer.
      - name: Pack the site for the portal
        run: |
          tar -czf library-site.tar.gz -C site .
          sha256sum library-site.tar.gz > library-site.tar.gz.sha256
          ls -la library-site.tar.gz

      - name: Publish the rolling library release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete library --yes --cleanup-tag 2>/dev/null || true
          gh release create library             --title "library (rolling)"             --notes "The built library and the signed manifest, republished on every build. Pulled by ninja-portal.com. Not a version — this tag always points at the latest build."             library-site.tar.gz library-site.tar.gz.sha256             dist/constellation.json dist/constellation.json.sig             dist/constellation.tsv dist/constellation.tsv.sig             manifest.pub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
